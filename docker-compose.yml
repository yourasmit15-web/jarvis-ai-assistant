version: "3.9"
services:
  backend:
    build: .
    command: uvicorn backend.app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
  frontend:
    image: node:20-alpine
    working_dir: /app/frontend
    command: sh -c "npm install && npm start"
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
    environment:
      - REACT_APP_API_BASE_URL=http://backend:8000
